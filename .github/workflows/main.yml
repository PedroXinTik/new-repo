          package com.tomo.agente

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView

          class OverlayService : Service() {

              private lateinit var windowManager: WindowManager
              private var floatingButton: TextView? = null
              private var layoutParams: WindowManager.LayoutParams? = null

              companion object {
                  const val ACTION_START =
                      "com.tomo.agente.OVERLAY_START"

                  const val ACTION_STOP =
                      "com.tomo.agente.OVERLAY_STOP"

                  const val CHANNEL_ID = "agente_assistente"
                  const val NOTIFICATION_ID = 808
              }

              override fun onCreate() {
                  super.onCreate()
                  windowManager =
                      getSystemService(WINDOW_SERVICE) as WindowManager
              }

              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int
              ): Int {
                  when (intent?.action) {
                      ACTION_STOP -> {
                          removerBotao()
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          stopSelf()
                          return START_NOT_STICKY
                      }
                  }

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  if (!iniciarNotificacao()) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  mostrarBotao()
                  return START_NOT_STICKY
              }

              private fun iniciarNotificacao(): Boolean {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val channel = NotificationChannel(
                              CHANNEL_ID,
                              "Agente em execução",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply {
                              description =
                                  "Notificação do botão flutuante do Agente"
                          }

                          val manager =
                              getSystemService(NotificationManager::class.java)

                          manager.createNotificationChannel(channel)
                      }

                      val notification = if (
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ) {
                          Notification.Builder(this, CHANNEL_ID)
                      } else {
                          @Suppress("DEPRECATION")
                          Notification.Builder(this)
                      }
                          .setSmallIcon(
                              android.R.drawable.ic_dialog_info
                          )
                          .setContentTitle("Agente")
                          .setContentText(
                              "Botão flutuante ativado pelo usuário"
                          )
                          .setOngoing(true)
                          .build()

                      startForeground(NOTIFICATION_ID, notification)
                      true
                  } catch (_: Exception) {
                      false
                  }
              }

              private fun mostrarBotao() {
                  if (floatingButton != null) return

                  val button = TextView(this).apply {
                      text = "A"
                      textSize = 23f
                      gravity = Gravity.CENTER
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)

                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(
                              AgenteTheme.BLUE,
                              AgenteTheme.PURPLE
                          )
                      ).apply {
                          shape = GradientDrawable.OVAL
                          setStroke(3, Color.WHITE)
                      }

                      contentDescription =
                          "Botão flutuante para abrir o Agente"

                      elevation = 12f
                  }

                  val params = WindowManager.LayoutParams(
                      dp(60),
                      dp(60),
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      } else {
                          @Suppress("DEPRECATION")
                          WindowManager.LayoutParams.TYPE_PHONE
                      },
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(16)
                      y = dp(180)
                  }

                  var initialX = 0
                  var initialY = 0
                  var initialTouchX = 0f
                  var initialTouchY = 0f
                  var moved = false

                  button.setOnTouchListener { view, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              moved = false
                              true
                          }

                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.rawX - initialTouchX
                              val dy = event.rawY - initialTouchY

                              if (kotlin.math.abs(dx) > dp(8) ||
                                  kotlin.math.abs(dy) > dp(8)) {
                                  moved = true
                              }

                              params.x = initialX + dx.toInt()
                              params.y = initialY + dy.toInt()

                              try {
                                  windowManager.updateViewLayout(
                                      view,
                                      params
                                  )
                              } catch (_: Exception) {
                              }

                              true
                          }

                          MotionEvent.ACTION_UP -> {
                              if (!moved) {
                                  abrirAgente()
                              }
                              true
                          }

                          else -> false
                      }
                  }

                  try {
                      windowManager.addView(button, params)
                      floatingButton = button
                      layoutParams = params
                  } catch (_: Exception) {
                      floatingButton = null
                      layoutParams = null
                  }
              }

              private fun abrirAgente() {
                  val intent = Intent(this, MainActivity::class.java).apply {
                      addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK or
                              Intent.FLAG_ACTIVITY_SINGLE_TOP
                      )
                  }

                  try {
                      startActivity(intent)
                  } catch (_: Exception) {
                  }
              }

              private fun removerBotao() {
                  val button = floatingButton ?: return

                  try {
                      windowManager.removeView(button)
                  } catch (_: Exception) {
                  }

                  floatingButton = null
                  layoutParams = null
              }

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }

              override fun onDestroy() {
                  removerBotao()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
