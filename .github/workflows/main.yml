          cat > app/src/main/java/com/tomo/agente/Database.kt <<'EOF'
          package com.tomo.agente

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper

          data class MemoryItem(
              val id: Long,
              val category: String,
              val game: String,
              val content: String,
              val createdAt: Long
          )

          class MemoryDatabase(context: Context) :
              SQLiteOpenHelper(context, "agente_memoria.db", null, 1) {

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL(
                      """
                      CREATE TABLE memories (
                          id INTEGER PRIMARY KEY AUTOINCREMENT,
                          category TEXT NOT NULL,
                          game TEXT NOT NULL DEFAULT '',
                          content TEXT NOT NULL,
                          created_at INTEGER NOT NULL
                      )
                      """.trimIndent()
                  )

                  db.execSQL(
                      "CREATE INDEX idx_memories_category ON memories(category)"
                  )

                  db.execSQL(
                      "CREATE INDEX idx_memories_game ON memories(game)"
                  )
              }

              override fun onUpgrade(
                  db: SQLiteDatabase,
                  oldVersion: Int,
                  newVersion: Int
              ) {
                  // Migrações futuras serão adicionadas sem apagar memórias.
              }

              @Synchronized
              fun save(
                  category: String,
                  content: String,
                  game: String = ""
              ): Long {
                  require(content.isNotBlank()) {
                      "A memória não pode estar vazia."
                  }

                  val values = ContentValues().apply {
                      put("category", category)
                      put("game", game)
                      put("content", content.trim())
                      put("created_at", System.currentTimeMillis())
                  }

                  return writableDatabase.insert("memories", null, values)
              }

              @Synchronized
              fun search(
                  query: String,
                  category: String? = null,
                  game: String? = null,
                  limit: Int = 30
              ): List<MemoryItem> {
                  val conditions = mutableListOf<String>()
                  val args = mutableListOf<String>()

                  if (query.isNotBlank()) {
                      conditions += "content LIKE ?"
                      args += "%${query.trim()}%"
                  }

                  if (category != null) {
                      conditions += "category = ?"
                      args += category
                  }

                  if (game != null) {
                      conditions += "game = ?"
                      args += game
                  }

                  val where = if (conditions.isEmpty()) {
                      ""
                  } else {
                      "WHERE " + conditions.joinToString(" AND ")
                  }

                  val result = mutableListOf<MemoryItem>()

                  readableDatabase.rawQuery(
                      """
                      SELECT id, category, game, content, created_at
                      FROM memories
                      $where
                      ORDER BY created_at DESC
                      LIMIT ?
                      """.trimIndent(),
                      (args + limit.coerceIn(1, 100).toString()).toTypedArray()
                  ).use { cursor ->
                      while (cursor.moveToNext()) {
                          result += MemoryItem(
                              id = cursor.getLong(0),
                              category = cursor.getString(1),
                              game = cursor.getString(2),
                              content = cursor.getString(3),
                              createdAt = cursor.getLong(4)
                          )
                      }
                  }

                  return result
              }

              @Synchronized
              fun deleteMemory(id: Long): Boolean {
                  return writableDatabase.delete(
                      "memories",
                      "id = ?",
                      arrayOf(id.toString())
                  ) > 0
              }

              @Synchronized
              fun count(): Int {
                  readableDatabase.rawQuery(
                      "SELECT COUNT(*) FROM memories",
                      null
                  ).use { cursor ->
                      return if (cursor.moveToFirst()) cursor.getInt(0) else 0
                  }
              }
          }
          EOF

