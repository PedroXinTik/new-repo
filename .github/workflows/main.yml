                    cat > agente/app/src/main/java/com/tomo/agente/GeminiClient.kt <<'EOF'
          package com.tomo.agente

          import android.graphics.Bitmap
          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.charset.StandardCharsets

          object GeminiClient {

              private const val MODEL = "gemini-2.5-flash"

              fun perguntar(
                  apiKey: String,
                  prompt: String,
                  memories: List<MemoryItem> = emptyList(),
                  screenshot: Bitmap? = null
              ): String {

                  require(apiKey.isNotBlank()) {
                      "A chave da API Gemini não foi configurada."
                  }

                  require(prompt.isNotBlank()) {
                      "Digite uma pergunta ou comando."
                  }

                  val contextoMemoria = if (memories.isEmpty()) {
                      "Nenhuma memória relevante foi encontrada."
                  } else {
                      memories.joinToString("\n") {
                          val jogo = if (it.game.isNotBlank()) {
                              " | Jogo: ${it.game}"
                          } else {
                              ""
                          }

                          "[${it.category}$jogo] ${it.content}"
                      }
                  }

                  val instrucoes = """
                      Você é o Agente, um assistente inteligente que conversa
                      em português brasileiro.

                      Seja claro, educado e objetivo.
                      Ajude o usuário a compreender aplicativos e jogos.
                      Não afirme que executou uma ação se ela não foi realizada.
                      Não invente informações sobre a tela.
                      Se não tiver certeza, explique a incerteza.

                      MEMÓRIAS RECUPERADAS:
                      $contextoMemoria

                      SOLICITAÇÃO DO USUÁRIO:
                      $prompt

                      Se o usuário compartilhar uma captura de tela,
                      analise apenas os elementos que conseguir identificar.
                      Sugira ações seguras e explique o que pretende fazer.
                  """.trimIndent()

                  val parts = JSONArray()
                      .put(JSONObject().put("text", instrucoes))

                  if (screenshot != null) {
                      val bitmap = reduzirImagem(screenshot)
                      val output = ByteArrayOutputStream()

                      try {
                          bitmap.compress(
                              Bitmap.CompressFormat.JPEG,
                              75,
                              output
                          )

                          val encoded = Base64.encodeToString(
                              output.toByteArray(),
                              Base64.NO_WRAP
                          )

                          parts.put(
                              JSONObject()
                                  .put(
                                      "inline_data",
                                      JSONObject()
                                          .put("mime_type", "image/jpeg")
                                          .put("data", encoded)
                                  )
                          )
                      } finally {
                          output.close()

                          if (bitmap !== screenshot) {
                              bitmap.recycle()
                          }
                      }
                  }

                  val requestBody = JSONObject()
                      .put(
                          "contents",
                          JSONArray().put(
                              JSONObject()
                                  .put("role", "user")
                                  .put("parts", parts)
                          )
                      )
                      .put(
                          "generationConfig",
                          JSONObject()
                              .put("temperature", 0.4)
                              .put("maxOutputTokens", 1500)
                      )

                  val endpoint =
                      "https://generativelanguage.googleapis.com/v1beta/models/" +
                      "$MODEL:generateContent"

                  val connection =
                      URL(endpoint).openConnection() as HttpURLConnection

                  try {
                      connection.requestMethod = "POST"
                      connection.connectTimeout = 20000
                      connection.readTimeout = 45000
                      connection.doOutput = true

                      connection.setRequestProperty(
                          "Content-Type",
                          "application/json; charset=UTF-8"
                      )

                      connection.setRequestProperty(
                          "x-goog-api-key",
                          apiKey
                      )

                      connection.outputStream.use { stream ->
                          stream.write(
                              requestBody.toString()
                                  .toByteArray(StandardCharsets.UTF_8)
                          )
                      }

                      val status = connection.responseCode

                      val responseStream =
                          if (status in 200..299) {
                              connection.inputStream
                          } else {
                              connection.errorStream
                          }

                      val response = responseStream
                          ?.bufferedReader(StandardCharsets.UTF_8)
                          ?.use { it.readText() }
                          .orEmpty()

                      if (status !in 200..299) {
                          val detail = try {
                              JSONObject(response)
                                  .optJSONObject("error")
                                  ?.optString("message")
                          } catch (_: Exception) {
                              null
                          }

                          throw IllegalStateException(
                              "Erro Gemini HTTP $status: " +
                              (detail ?: response.take(250))
                          )
                      }

                      val root = JSONObject(response)

                      val candidates =
                          root.optJSONArray("candidates")
                              ?: throw IllegalStateException(
                                  "A Gemini não retornou uma resposta válida."
                              )

                      val candidate = candidates.optJSONObject(0)
                          ?: throw IllegalStateException(
                              "A resposta da Gemini está vazia."
                          )

                      val content = candidate.optJSONObject("content")
                          ?: throw IllegalStateException(
                              "Não foi possível ler a resposta."
                          )

                      val responseParts =
                          content.optJSONArray("parts")
                              ?: throw IllegalStateException(
                                  "A resposta não contém texto."
                              )

                      val answer = StringBuilder()

                      for (index in 0 until responseParts.length()) {
                          val item = responseParts.optJSONObject(index)
                          val text = item?.optString("text").orEmpty()

                          if (text.isNotBlank()) {
                              if (answer.isNotEmpty()) {
                                  answer.append('\n')
                              }

                              answer.append(text)
                          }
                      }

                      return answer.toString().ifBlank {
                          "A Gemini não retornou texto legível."
                      }

                  } finally {
                      connection.disconnect()
                  }
              }

              private fun reduzirImagem(source: Bitmap): Bitmap {
                  val maiorLado = maxOf(source.width, source.height)

                  if (maiorLado <= 1280) {
                      return source
                  }

                  val escala = 1280f / maiorLado

                  return Bitmap.createScaledBitmap(
                      source,
                      (source.width * escala).toInt().coerceAtLeast(1),
                      (source.height * escala).toInt().coerceAtLeast(1),
                      true
                  )
              }
          }
          EOF

                    cat > agente/app/src/main/java/com/tomo/agente/VoiceManager.kt <<'EOF'
          package com.tomo.agente

          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.util.Locale

          class VoiceManager(
              private val context: Context,
              private val onRecognized: (String) -> Unit,
              private val onStatus: (String) -> Unit
          ) : TextToSpeech.OnInitListener {

              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var listening = false

              init {
                  tts = TextToSpeech(context.applicationContext, this)
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val result = tts?.setLanguage(Locale("pt", "BR"))
                      ttsReady =
                          result != TextToSpeech.LANG_MISSING_DATA &&
                          result != TextToSpeech.LANG_NOT_SUPPORTED

                      if (ttsReady) {
                          tts?.setSpeechRate(1.0f)
                          onStatus("Voz do Agente pronta.")
                      } else {
                          onStatus("Português não está disponível no mecanismo de voz.")
                      }
                  } else {
                      onStatus("Não foi possível iniciar a voz do Android.")
                  }
              }

              fun falar(texto: String) {
                  if (texto.isBlank()) return

                  if (!ttsReady || tts == null) {
                      onStatus("A voz ainda está sendo preparada.")
                      return
                  }

                  val textoSeguro = texto.take(3500)

                  tts?.speak(
                      textoSeguro,
                      TextToSpeech.QUEUE_FLUSH,
                      Bundle(),
                      "agente-${System.currentTimeMillis()}"
                  )
              }

              fun pararFala() {
                  tts?.stop()
              }

              fun iniciarEscuta() {
                  if (!SpeechRecognizer.isRecognitionAvailable(context)) {
                      onStatus("Reconhecimento de voz indisponível neste aparelho.")
                      return
                  }

                  pararEscuta()

                  recognizer = SpeechRecognizer.createSpeechRecognizer(context)

                  recognizer?.setRecognitionListener(
                      object : RecognitionListener {

                          override fun onReadyForSpeech(params: Bundle?) {
                              listening = true
                              onStatus("Pode falar, paizão.")
                          }

                          override fun onBeginningOfSpeech() {}

                          override fun onRmsChanged(rmsdB: Float) {}

                          override fun onBufferReceived(buffer: ByteArray?) {}

                          override fun onEndOfSpeech() {
                              listening = false
                              onStatus("Processando sua fala…")
                          }

                          override fun onError(error: Int) {
                              listening = false

                              val message = when (error) {
                                  SpeechRecognizer.ERROR_AUDIO ->
                                      "Erro ao acessar o áudio."
                                  SpeechRecognizer.ERROR_NETWORK ->
                                      "Problema de conexão durante o reconhecimento."
                                  SpeechRecognizer.ERROR_NO_MATCH ->
                                      "Não consegui entender. Tente novamente."
                                  SpeechRecognizer.ERROR_SPEECH_TIMEOUT ->
                                      "Não detectei fala."
                                  SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS ->
                                      "O microfone não tem permissão."
                                  else ->
                                      "O reconhecimento de voz falhou. Tente novamente."
                              }

                              onStatus(message)
                          }

                          override fun onResults(results: Bundle?) {
                              listening = false

                              val matches = results?.getStringArrayList(
                                  SpeechRecognizer.RESULTS_RECOGNITION
                              )

                              val phrase = matches?.firstOrNull()?.trim()

                              if (!phrase.isNullOrBlank()) {
                                  onRecognized(phrase)
                              } else {
                                  onStatus("Nenhuma frase foi reconhecida.")
                              }
                          }

                          override fun onPartialResults(
                              partialResults: Bundle?
                          ) {}

                          override fun onEvent(
                              eventType: Int,
                              params: Bundle?
                          ) {}
                      }
                  )

                  val intent = Intent(
                      RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                  ).apply {
                      putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                      )

                      putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE,
                          "pt-BR"
                      )

                      putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE,
                          "pt-BR"
                      )

                      putExtra(
                          RecognizerIntent.EXTRA_MAX_RESULTS,
                          3
                      )

                      putExtra(
                          RecognizerIntent.EXTRA_PARTIAL_RESULTS,
                          false
                      )
                  }

                  try {
                      recognizer?.startListening(intent)
                  } catch (e: Exception) {
                      listening = false
                      onStatus("Não foi possível iniciar a escuta: ${e.message}")
                  }
              }

              fun pararEscuta() {
                  listening = false

                  try {
                      recognizer?.cancel()
                      recognizer?.destroy()
                  } catch (_: Exception) {
                  }

                  recognizer = null
              }

              fun estaEscutando(): Boolean = listening

              fun destruir() {
                  pararEscuta()

                  try {
                      tts?.stop()
                      tts?.shutdown()
                  } catch (_: Exception) {
                  }

                  tts = null
                  ttsReady = false
              }
          }
          EOF
          cat > agente/app/src/main/java/com/tomo/agente/MainActivity.kt <<'EOF'
          package com.tomo.agente

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.content.Context
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.util.concurrent.Executors

          class MainActivity : Activity() {

              private lateinit var prefs: SharedPreferences
              private lateinit var memoria: MemoryDatabase
              private lateinit var chave: EditText
              private lateinit var pergunta: EditText
              private lateinit var resposta: TextView
              private lateinit var status: TextView
              private lateinit var voz: VoiceManager

              private val executor = Executors.newSingleThreadExecutor()

              private var ultimaPergunta = ""
              private var imagem: android.graphics.Bitmap? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  prefs = getSharedPreferences("agente_config", MODE_PRIVATE)
                  memoria = MemoryDatabase(this)

                  voz = VoiceManager(
                      this,
                      onRecognized = { frase ->
                          runOnUiThread {
                              pergunta.setText(frase)
                              enviarPergunta()
                          }
                      },
                      onStatus = { mensagem ->
                          runOnUiThread {
                              status.text = mensagem
                          }
                      }
                  )

                  montarInterface()
              }

              private fun montarInterface() {
                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(AgenteTheme.BACKGROUND)
                      fillViewport = true
                  }

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(20, 28, 20, 28)
                  }

                  val titulo = TextView(this).apply {
                      text = "A G E N T E"
                      textSize = 29f
                      setTextColor(AgenteTheme.BLUE)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }

                  layout.addView(
                      titulo,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  val subtitulo = TextView(this).apply {
                      text = "INTELIGÊNCIA • MEMÓRIA • AUTOMAÇÃO"
                      textSize = 11f
                      gravity = Gravity.CENTER
                      setTextColor(AgenteTheme.PURPLE)
                      setPadding(0, 8, 0, 22)
                  }

                  layout.addView(subtitulo)

                  val painel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = AgenteTheme.panelBackground()
                      setPadding(18, 18, 18, 18)
                  }

                  painel.addView(TextView(this).apply {
                      text = "NÚCLEO DE INTELIGÊNCIA"
                      textSize = 16f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(AgenteTheme.TEXT)
                  })

                  status = TextView(this).apply {
                      text = "Inicializando o Agente..."
                      textSize = 13f
                      setTextColor(AgenteTheme.BLUE)
                      setPadding(0, 10, 0, 16)
                  }

                  painel.addView(status)

                  chave = EditText(this).apply {
                      hint = "Chave da API Gemini"
                      setSingleLine(true)
                      setText(prefs.getString("gemini_key", ""))
                      setTextColor(Color.WHITE)
                      setHintTextColor(AgenteTheme.MUTED)
                      background = campoBackground()
                  }

                  painel.addView(campoComMargem(chave))

                  pergunta = EditText(this).apply {
                      hint = "Digite seu comando..."
                      minLines = 2
                      maxLines = 5
                      gravity = Gravity.TOP
                      setTextColor(Color.WHITE)
                      setHintTextColor(AgenteTheme.MUTED)
                      background = campoBackground()
                  }

                  painel.addView(campoComMargem(pergunta))

                  adicionarBotao(
                      painel,
                      "SALVAR CHAVE GEMINI",
                      AgenteTheme.PURPLE
                  ) {
                      val key = chave.text.toString().trim()

                      if (key.isBlank()) {
                          informar("Digite a chave antes de salvar.")
                      } else {
                          prefs.edit().putString("gemini_key", key).apply()
                          informar("Chave salva neste aparelho.")
                      }
                  }

                  adicionarBotao(
                      painel,
                      "ENVIAR COMANDO À IA",
                      AgenteTheme.BLUE
                  ) {
                      enviarPergunta()
                  }

                  adicionarBotao(
                      painel,
                      "🎙 FALAR COM O AGENTE",
                      AgenteTheme.PURPLE
                  ) {
                      if (
                          checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED
                      ) {
                          requestPermissions(
                              arrayOf(Manifest.permission.RECORD_AUDIO),
                              101
                          )
                      } else {
                          voz.iniciarEscuta()
                      }
                  }

                  adicionarBotao(
                      painel,
                      "PARAR ESCUTA",
                      0xFF343B54.toInt()
                  ) {
                      voz.pararEscuta()
                      informar("Escuta interrompida.")
                  }

                  adicionarBotao(
                      painel,
                      "ATIVAR ACESSIBILIDADE",
                      AgenteTheme.PURPLE
                  ) {
                      startActivity(
                          Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                      )
                  }

                  adicionarBotao(
                      painel,
                      "PERMITIR BOTÃO FLUTUANTE",
                      AgenteTheme.BLUE
                  ) {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                  }

                  adicionarBotao(
                      painel,
                      "MEMÓRIA PERMANENTE",
                      AgenteTheme.PURPLE
                  ) {
                      abrirMemoria("permanente")
                  }

                  adicionarBotao(
                      painel,
                      "MEMÓRIA DE JOGOS",
                      AgenteTheme.BLUE
                  ) {
                      abrirMemoria("jogo")
                  }

                  adicionarBotao(
                      painel,
                      "FALAR ÚLTIMA RESPOSTA",
                      AgenteTheme.PURPLE
                  ) {
                      voz.falar(resposta.text.toString())
                  }

                  layout.addView(
                      painel,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  resposta = TextView(this).apply {
                      text = "Olá! Configure a Gemini para começar."
                      textSize = 16f
                      setTextColor(AgenteTheme.TEXT)
                      setPadding(8, 22, 8, 22)
                  }

                  layout.addView(resposta)

                  scroll.addView(layout)
                  setContentView(scroll)

                  status.text = "Sistema inicializado."
              }

              private fun campoBackground(): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(0xFF090E20.toInt())
                      cornerRadius = 18f
                      setStroke(2, AgenteTheme.PURPLE)
                  }
              }

              private fun campoComMargem(view: View): View {
                  return view.apply {
                      setPadding(14, 12, 14, 12)
                  }.also {
                      it.layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = 12
                      }
                  }
              }

              private fun adicionarBotao(
                  parent: LinearLayout,
                  texto: String,
                  cor: Int,
                  acao: () -> Unit
              ) {
                  val botao = Button(this).apply {
                      text = texto
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      isAllCaps = false

                      background = GradientDrawable().apply {
                          setColor(0xFF11182C.toInt())
                          cornerRadius = 20f
                          setStroke(2, cor)
                      }

                      setOnClickListener {
                          acao()
                      }
                  }

                  parent.addView(
                      botao,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = 9
                      }
                  )
              }

              private fun enviarPergunta() {
                  val key = chave.text.toString().trim()
                  val texto = pergunta.text.toString().trim()

                  if (key.isBlank()) {
                      informar("Configure a chave da Gemini primeiro.")
                      return
                  }

                  if (texto.isBlank()) {
                      informar("Digite ou fale alguma coisa.")
                      return
                  }

                  prefs.edit().putString("gemini_key", key).apply()
                  ultimaPergunta = texto
                  status.text = "Consultando a inteligência artificial..."

                  executor.execute {
                      try {
                          val encontrados = memoria.search(
                              query = texto,
                              limit = 12
                          )

                          val resultado = GeminiClient.perguntar(
                              apiKey = key,
                              prompt = texto,
                              memories = encontrados,
                              screenshot = imagem
                          )

                          runOnUiThread {
                              resposta.text = resultado
                              status.text = "Resposta recebida."
                              voz.falar(resultado)
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              status.text = "Erro na consulta."
                              resposta.text =
                                  "Não consegui consultar a Gemini: " +
                                  (e.message ?: "erro desconhecido")
                          }
                      }
                  }
              }

              private fun abrirMemoria(categoria: String) {
                  val entrada = EditText(this).apply {
                      hint = if (categoria == "jogo") {
                          "Jogo e informação para guardar"
                      } else {
                          "Informação permanente para guardar"
                      }
                      setTextColor(Color.WHITE)
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 12, 24, 12)
                      addView(entrada)
                  }

                  android.app.AlertDialog.Builder(this)
                      .setTitle(
                          if (categoria == "jogo") {
                              "Memória de jogos"
                          } else {
                              "Memória permanente"
                          }
                      )
                      .setView(container)
                      .setPositiveButton("Salvar") { _, _ ->
                          val texto = entrada.text.toString().trim()

                          if (texto.isNotBlank()) {
                              val jogo = if (categoria == "jogo") {
                                  "Roblox"
                              } else {
                                  ""
                              }

                              executor.execute {
                                  try {
                                      memoria.save(
                                          category = categoria,
                                          content = texto,
                                          game = jogo
                                      )

                                      runOnUiThread {
                                          informar("Memória salva no aparelho.")
                                      }
                                  } catch (e: Exception) {
                                      runOnUiThread {
                                          informar("Erro ao salvar memória.")
                                      }
                                  }
                              }
                          }
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun informar(texto: String) {
                  Toast.makeText(
                      this,
                      texto,
                      Toast.LENGTH_LONG
                  ).show()
              }

              override fun onDestroy() {
                  voz.destruir()
                  executor.shutdownNow()
                  imagem?.recycle()
                  imagem = null
                  super.onDestroy()
              }
          }
