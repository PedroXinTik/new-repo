          package com.tomo.agente

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.os.Handler
          import android.os.Looper
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import java.util.concurrent.Executor

          class AgenteService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: AgenteService? = null
                      private set
              }

              private val mainHandler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  // Os eventos não são enviados automaticamente para a internet.
              }

              override fun onInterrupt() {
                  // O Android pode interromper o serviço.
              }

              override fun onDestroy() {
                  if (instance === this) {
                      instance = null
                  }
                  super.onDestroy()
              }

              fun tocar(
                  x: Float,
                  y: Float,
                  duracaoMs: Long = 100L,
                  callback: (Boolean) -> Unit = {}
              ) {
                  val largura = resources.displayMetrics.widthPixels.toFloat()
                  val altura = resources.displayMetrics.heightPixels.toFloat()

                  if (x < 0 || y < 0 || x >= largura || y >= altura) {
                      callback(false)
                      return
                  }

                  val caminho = Path().apply {
                      moveTo(x, y)
                      lineTo(x + 1f, y + 1f)
                  }

                  val gesto = GestureDescription.Builder()
                      .addStroke(
                          GestureDescription.StrokeDescription(
                              caminho,
                              0L,
                              duracaoMs.coerceIn(50L, 20_000L)
                          )
                      )
                      .build()

                  val aceito = dispatchGesture(
                      gesto,
                      object : GestureResultCallback() {
                          override fun onCompleted(
                              gestureDescription: GestureDescription?
                          ) {
                              callback(true)
                          }

                          override fun onCancelled(
                              gestureDescription: GestureDescription?
                          ) {
                              callback(false)
                          }
                      },
                      mainHandler
                  )

                  if (!aceito) {
                      callback(false)
                  }
              }

              fun arrastar(
                  xInicial: Float,
                  yInicial: Float,
                  xFinal: Float,
                  yFinal: Float,
                  duracaoMs: Long = 500L,
                  callback: (Boolean) -> Unit = {}
              ) {
                  val largura = resources.displayMetrics.widthPixels.toFloat()
                  val altura = resources.displayMetrics.heightPixels.toFloat()

                  val coordenadasValidas =
                      xInicial in 0f..largura &&
                      xFinal in 0f..largura &&
                      yInicial in 0f..altura &&
                      yFinal in 0f..altura

                  if (!coordenadasValidas) {
                      callback(false)
                      return
                  }

                  val caminho = Path().apply {
                      moveTo(xInicial, yInicial)
                      lineTo(xFinal, yFinal)
                  }

                  val gesto = GestureDescription.Builder()
                      .addStroke(
                          GestureDescription.StrokeDescription(
                              caminho,
                              0L,
                              duracaoMs.coerceIn(100L, 20_000L)
                          )
                      )
                      .build()

                  val aceito = dispatchGesture(
                      gesto,
                      object : GestureResultCallback() {
                          override fun onCompleted(
                              gestureDescription: GestureDescription?
                          ) {
                              callback(true)
                          }

                          override fun onCancelled(
                              gestureDescription: GestureDescription?
                          ) {
                              callback(false)
                          }
                      },
                      mainHandler
                  )

                  if (!aceito) {
                      callback(false)
                  }
              }

              fun capturarTela(callback: (Bitmap?) -> Unit) {
                  val executor = Executor { command ->
                      mainHandler.post(command)
                  }

                  try {
                      takeScreenshot(
                          Display.DEFAULT_DISPLAY,
                          executor,
                          object : TakeScreenshotCallback {

                              override fun onSuccess(
                                  result: ScreenshotResult
                              ) {
                                  try {
                                      val hardwareBuffer = result.hardwareBuffer

                                      val bitmapHardware =
                                          Bitmap.wrapHardwareBuffer(
                                              hardwareBuffer,
                                              result.colorSpace
                                          )

                                      hardwareBuffer.close()

                                      val copia = bitmapHardware?.copy(
                                          Bitmap.Config.ARGB_8888,
                                          false
                                      )

                                      callback(copia)
                                  } catch (_: Exception) {
                                      try {
                                          result.hardwareBuffer.close()
                                      } catch (_: Exception) {
                                      }

                                      callback(null)
                                  }
                              }

                              override fun onFailure(errorCode: Int) {
                                  callback(null)
                              }
                          }
                      )
                  } catch (_: Exception) {
                      callback(null)
                  }
              }
          }
