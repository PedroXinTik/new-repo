name: Agente Android - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agente-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Construir APK do Agente
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Criar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p agente/app/src/main/java/com/agente/app
          mkdir -p agente/app/src/main/res/values
          mkdir -p agente/app/src/main/res/xml

          cat > agente/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Agente"
          include(":app")
          EOF

          cat > agente/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > agente/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > agente/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.agente.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.agente.app"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
          }
          EOF

          cat > agente/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Agente</string>
              <string name="accessibility_description">Serviço de acessibilidade do Agente para gestos solicitados pelo usuário.</string>
          </resources>
          EOF

          cat > agente/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8B5CF6</item>
                  <item name="android:statusBarColor">#090B1A</item>
                  <item name="android:navigationBarColor">#090B1A</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > agente/app/src/main/res/xml/agente_accessibility.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="100" />
          EOF

          cat > agente/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AgenteService"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/agente_accessibility" />
                  </service>

              </application>
          </manifest>
          EOF

          cat > agente/app/src/main/java/com/agente/app/AgenteService.kt <<'EOF'
          package com.agente.app

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent

          class AgenteService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instancia: AgenteService? = null
                      private set

                  @Volatile
                  var ultimoResultado: String = "Serviço ainda não ativado."
                      private set

                  fun tocar(x: Float, y: Float, duracao: Long = 100L) {
                      val servico = instancia
                      if (servico == null) {
                          ultimoResultado = "Ative a acessibilidade nas configurações."
                      } else {
                          servico.executarToque(x, y, duracao)
                      }
                  }

                  fun deslizar(
                      x1: Float,
                      y1: Float,
                      x2: Float,
                      y2: Float,
                      duracao: Long = 500L
                  ) {
                      val servico = instancia
                      if (servico == null) {
                          ultimoResultado = "Ative a acessibilidade nas configurações."
                      } else {
                          servico.executarDeslizamento(x1, y1, x2, y2, duracao)
                      }
                  }
              }

              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instancia = this
                  ultimoResultado = "Acessibilidade ativada."
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  // Nenhuma ação automática é executada aqui.
              }

              override fun onInterrupt() {
                  ultimoResultado = "Serviço interrompido pelo Android."
              }

              private fun executarToque(
                  x: Float,
                  y: Float,
                  duracao: Long
              ) {
                  val caminho = Path().apply {
                      moveTo(x, y)
                      lineTo(x + 1f, y + 1f)
                  }

                  val gesto = GestureDescription.Builder()
                      .addStroke(
                          GestureDescription.StrokeDescription(
                              caminho, 0, duracao.coerceIn(1, 20000)
                          )
                      )
                      .build()

                  dispatchGesture(gesto, object : GestureResultCallback() {
                      override fun onCompleted(
                          gestureDescription: GestureDescription?
                      ) {
                          ultimoResultado = "Gesto concluído."
                      }

                      override fun onCancelled(
                          gestureDescription: GestureDescription?
                      ) {
                          ultimoResultado = "Gesto cancelado."
                      }
                  }, handler)
              }

              private fun executarDeslizamento(
                  x1: Float,
                  y1: Float,
                  x2: Float,
                  y2: Float,
                  duracao: Long
              ) {
                  val caminho = Path().apply {
                      moveTo(x1, y1)
                      lineTo(x2, y2)
                  }

                  val gesto = GestureDescription.Builder()
                      .addStroke(
                          GestureDescription.StrokeDescription(
                              caminho, 0, duracao.coerceIn(1, 20000)
                          )
                      )
                      .build()

                  dispatchGesture(gesto, object : GestureResultCallback() {
                      override fun onCompleted(
                          gestureDescription: GestureDescription?
                      ) {
                          ultimoResultado = "Deslizamento concluído."
                      }

                      override fun onCancelled(
                          gestureDescription: GestureDescription?
                      ) {
                          ultimoResultado = "Deslizamento cancelado."
                      }
                  }, handler)
              }

              override fun onDestroy() {
                  if (instancia === this) instancia = null
                  super.onDestroy()
              }
          }
          EOF

          cat > agente/app/src/main/java/com/agente/app/MainActivity.kt <<'EOF'
          package com.agente.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.os.Bundle
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.content.Context
          import android.content.Intent
          import android.provider.Settings
          import android.net.Uri
          import android.view.Gravity
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import org.json.JSONObject
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL
          import java.io.OutputStreamWriter
          import java.util.Locale
          import java.util.concurrent.Executors

          class MainActivity : Activity(), TextToSpeech.OnInitListener {

              private val azul = Color.rgb(40, 130, 255)
              private val roxo = Color.rgb(145, 65, 255)
              private val fundo = Color.rgb(8, 10, 27)
              private val executor = Executors.newSingleThreadExecutor()
              private val memoria = mutableListOf<String>()
              private val historico = JSONArray()

              private lateinit var conversa: TextView
              private lateinit var rolagem: ScrollView
              private lateinit var entrada: EditText
              private lateinit var chave: EditText
              private lateinit var status: TextView
              private var tts: TextToSpeech? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = fundo
                  window.navigationBarColor = fundo
                  tts = TextToSpeech(this, this)
                  carregarMemoria()
                  montarInterface()
                  mostrar("AGENTE", "Olá! Sou o Agente. Vamos começar.")
              }

              override fun onInit(statusTts: Int) {
                  if (statusTts == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("pt", "BR")
                  }
              }

              private fun montarInterface() {
                  val raiz = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16, 16, 16, 12)
                      setBackgroundColor(fundo)
                  }

                  val titulo = TextView(this).apply {
                      text = "A G E N T E"
                      textSize = 29f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setTextColor(azul)
                      setPadding(0, 8, 0, 4)
                  }

                  val subtitulo = TextView(this).apply {
                      text = "INTELIGÊNCIA • MEMÓRIA • ASSISTÊNCIA"
                      textSize = 11f
                      gravity = Gravity.CENTER
                      setTextColor(roxo)
                      setPadding(0, 0, 0, 10)
                  }

                  status = TextView(this).apply {
                      text = "● SISTEMA PRONTO"
                      gravity = Gravity.CENTER
                      setTextColor(Color.GREEN)
                      setPadding(0, 8, 0, 8)
                  }

                  conversa = TextView(this).apply {
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setPadding(12, 12, 12, 12)
                  }

                  rolagem = ScrollView(this).apply {
                      background = painel()
                      addView(conversa)
                  }

                  chave = EditText(this).apply {
                      hint = "Chave da API Gemini"
                      setHintTextColor(Color.LTGRAY)
                      setTextColor(Color.WHITE)
                      inputType = 129
                      singleLine = true
                      setPadding(12, 8, 12, 8)
                      background = painel()
                  }

                  val salvarChave = botao("SALVAR CHAVE GEMINI", roxo) {
                      val valor = chave.text.toString().trim()
                      if (valor.isBlank()) {
                          mostrar("AGENTE", "Digite sua chave da API Gemini.")
                      } else {
                          getSharedPreferences("agente", MODE_PRIVATE)
                              .edit().putString("gemini_key", valor).apply()
                          chave.text.clear()
                          mostrar("AGENTE", "Chave salva neste aparelho.")
                      }
                  }

                  entrada = EditText(this).apply {
                      hint = "Digite sua mensagem..."
                      setHintTextColor(Color.LTGRAY)
                      setTextColor(Color.WHITE)
                      maxLines = 3
                      setPadding(12, 8, 12, 8)
                      background = painel()
                  }

                  val linha = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  linha.addView(entrada, LinearLayout.LayoutParams(0, -2, 1f))
                  linha.addView(botao("ENVIAR", azul) { enviarMensagem() })

                  raiz.addView(titulo)
                  raiz.addView(subtitulo)
                  raiz.addView(status)
                  raiz.addView(rolagem, LinearLayout.LayoutParams(-1, 0, 1f))
                  raiz.addView(chave)
                  raiz.addView(salvarChave)
                  raiz.addView(linha)
                  raiz.addView(botao("🎙 FALAR", roxo) { iniciarVoz() })
                  raiz.addView(botao("GUARDAR MEMÓRIA", azul) { guardarMemoria() })
                  raiz.addView(botao("CONSULTAR MEMÓRIA", roxo) { consultarMemoria() })
                  raiz.addView(botao("ATIVAR ACESSIBILIDADE", azul) {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  raiz.addView(botao("TESTAR TOQUE NO CENTRO", roxo) {
                      val largura = resources.displayMetrics.widthPixels.toFloat()
                      val altura = resources.displayMetrics.heightPixels.toFloat()
                      AgenteService.tocar(largura / 2, altura / 2)
                      mostrar("ACESSIBILIDADE", AgenteService.ultimoResultado)
                  })
                  raiz.addView(botao("LIMPAR CONVERSA", Color.DKGRAY) {
                      historico.clear()
                      conversa.text = ""
                      mostrar("AGENTE", "Conversa limpa. As memórias continuam salvas.")
                  })

                  setContentView(raiz)
              }

              private fun painel() = GradientDrawable().apply {
                  setColor(Color.rgb(20, 24, 49))
                  cornerRadius = 16f
                  setStroke(1, azul)
              }

              private fun botao(
                  texto: String,
                  cor: Int,
                  acao: () -> Unit
              ) = Button(this).apply {
                  text = texto
                  textSize = 12f
                  isAllCaps = false
                  setTextColor(Color.WHITE)
                  background = GradientDrawable().apply {
                      setColor(Color.rgb(32, 35, 72))
                      cornerRadius = 16f
                      setStroke(2, cor)
                  }
                  setOnClickListener { acao() }
              }

              private fun mostrar(remetente: String, texto: String) {
                  runOnUiThread {
                      conversa.append("\\n\\n$remetente:\\n$texto")
                      rolagem.post { rolagem.fullScroll(View.FOCUS_DOWN) }
                  }
              }

              private fun iniciarVoz() {
                  try {
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                              RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                          )
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "pt-BR")
                          putExtra(RecognizerIntent.EXTRA_PROMPT, "Fale com o Agente")
                      }
                      startActivityForResult(intent, 101)
                  } catch (e: Exception) {
                      mostrar("VOZ", "O reconhecimento de voz não está disponível neste aparelho.")
                  }
              }

              @Deprecated("API de resultado de voz")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 101 && resultCode == RESULT_OK) {
                      val falas = data?.getStringArrayListExtra(
                          RecognizerIntent.EXTRA_RESULTS
                      )
                      val fala = falas?.firstOrNull()
                      if (!fala.isNullOrBlank()) {
                          entrada.setText(fala)
                          enviarMensagem()
                      }
                  }
              }

              private fun guardarMemoria() {
                  val campo = EditText(this).apply {
                      hint = "O que devo lembrar?"
                      setTextColor(Color.WHITE)
                  }
                  val categorias = arrayOf("Permanente", "Roblox")
                  var categoria = 0

                  AlertDialog.Builder(this)
                      .setTitle("Guardar memória")
                      .setView(campo)
                      .setSingleChoiceItems(categorias, 0) { _, which ->
                          categoria = which
                      }
                      .setPositiveButton("GUARDAR") { _, _ ->
                          val texto = campo.text.toString().trim()
                          if (texto.isNotEmpty()) {
                              memoria.add(
                                  (if (categoria == 0) "permanente" else "Roblox") +
                                  "|" + texto
                              )
                              salvarMemoria()
                              mostrar("MEMÓRIA", "Informação guardada.")
                          }
                      }
                      .setNegativeButton("CANCELAR", null)
                      .show()
                  campo.setTextColor(Color.WHITE)
              }

              private fun salvarMemoria() {
                  val array = JSONArray()
                  memoria.forEach { array.put(it) }
                  getSharedPreferences("agente", MODE_PRIVATE)
                      .edit().putString("memoria", array.toString()).apply()
              }

              private fun carregarMemoria() {
                  val texto = getSharedPreferences("agente", MODE_PRIVATE)
                      .getString("memoria", "[]") ?: "[]"
                  try {
                      val array = JSONArray(texto)
                      for (i in 0 until array.length()) {
                          memoria.add(array.getString(i))
                      }
                  } catch (_: Exception) {
                      memoria.clear()
                  }
              }

              private fun consultarMemoria() {
                  val texto = if (memoria.isEmpty()) {
                      "Nenhuma memória guardada."
                  } else {
                      memoria.mapIndexed { i, item ->
                          "${i + 1}. ${item.substringAfter('|')}"
                      }.joinToString("\\n")
                  }
                  mostrar("MEMÓRIA", texto)
              }

              private fun enviarMensagem() {
                  val pergunta = entrada.text.toString().trim()
                  if (pergunta.isEmpty()) return
                  entrada.setText("")

                  (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager)
                      .hideSoftInputFromWindow(entrada.windowToken, 0)

                  mostrar("VOCÊ", pergunta)

                  val apiKey = getSharedPreferences("agente", MODE_PRIVATE)
                      .getString("gemini_key", null)

                  if (apiKey.isNullOrBlank()) {
                      mostrar("AGENTE", "Salve primeiro sua chave da API Gemini.")
                      return
                  }

                  val conteudos = JSONArray()
                  for (i in 0 until historico.length()) {
                      conteudos.put(historico.getJSONObject(i))
                  }
                  conteudos.put(
                      JSONObject().put("role", "user").put(
                          "parts",
                          JSONArray().put(JSONObject().put("text", pergunta))
                      )
                  )

                  status.text = "● PENSANDO..."
                  executor.execute {
                      try {
                          val contexto = memoria.joinToString("\\n") {
                              "- ${it.substringAfter('|')}"
                          }

                          val corpo = JSONObject().apply {
                              put(
                                  "system_instruction",
                                  JSONObject().put(
                                      "parts",
                                      JSONArray().put(
                                          JSONObject().put(
                                              "text",
                                              "Você é o Agente, assistente em português brasileiro. Seja útil e honesto. Memórias do usuário:\\n$contexto"
                                          )
                                      )
                                  )
                              )
                              put("contents", conteudos)
                              put(
                                  "generationConfig",
                                  JSONObject().put("temperature", 0.7)
                              )
                          }

                          val url = URL(
                              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$apiKey"
                          )
                          val conexao = url.openConnection() as HttpURLConnection
                          conexao.requestMethod = "POST"
                          conexao.connectTimeout = 20000
                          conexao.readTimeout = 30000
                          conexao.setRequestProperty("Content-Type", "application/json")
                          conexao.doOutput = true

                          OutputStreamWriter(
                              conexao.outputStream,
                              Charsets.UTF_8
                          ).use { it.write(corpo.toString()) }

                          val codigo = conexao.responseCode
                          val fluxo = if (codigo in 200..299) {
                              conexao.inputStream
                          } else {
                              conexao.errorStream
                          }

                          val respostaApi = fluxo.bufferedReader().use { it.readText() }
                          conexao.disconnect()

                          if (codigo !in 200..299) {
                              throw Exception("Erro da API: HTTP $codigo")
                          }

                          val resposta = JSONObject(respostaApi)
                              .getJSONArray("candidates")
                              .getJSONObject(0)
                              .getJSONObject("content")
                              .getJSONArray("parts")
                              .getJSONObject(0)
                              .getString("text")

                          historico.put(
                              JSONObject().put("role", "user").put(
                                  "parts",
                                  JSONArray().put(JSONObject().put("text", pergunta))
                              )
                          )
                          historico.put(
                              JSONObject().put("role", "model").put(
                                  "parts",
                                  JSONArray().put(JSONObject().put("text", resposta))
                              )
                          )

                          mostrar("AGENTE", resposta)
                          runOnUiThread {
                              status.text = "● SISTEMA PRONTO"
                              tts?.speak(resposta, TextToSpeech.QUEUE_FLUSH, null, "resposta")
                          }
                      } catch (e: Exception) {
                          mostrar("ERRO", e.message ?: "Falha na conexão.")
                          runOnUiThread {
                              status.text = "● VERIFIQUE A CHAVE E A INTERNET"
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  executor.shutdownNow()
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Compilar aplicativo Android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p agente assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="agente/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Agente-Android-APK
          path: agente/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
