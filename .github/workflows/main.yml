name: Gerar APK do Agente v8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gerar_apk_agente_v8.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android
        shell: bash
        run: |
          set -e
          mkdir -p proj/app/src/main/java/com/tomo/agente proj/app/src/main/res/xml proj/app/src/main/res/values
          cat > proj/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Agente"
          include ":app"
          EOF
          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          echo 'org.gradle.jvmargs=-Xmx2g' > proj/gradle.properties
          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tomo.agente'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.tomo.agente'
                  minSdk 30
                  targetSdk 34
                  versionCode 8
                  versionName '8.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <application android:label="Agente v8" android:allowBackup="false" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".AgenteService" android:exported="true" android:label="Agente" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/desc"
              android:notificationTimeout="100"/>
          EOF
          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="desc">O Agente analisa a tela e executa ações quando solicitado.</string></resources>
          EOF
          cat > proj/app/src/main/java/com/tomo/agente/AgenteService.kt <<'EOF'
          package com.tomo.agente

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          class AgenteService : AccessibilityService() {
              companion object {
                  var instance: AgenteService? = null
                  @Volatile var running = false
              }

              private var tts: TextToSpeech? = null
              private var recognizer: SpeechRecognizer? = null

              override fun onServiceConnected() {
                  instance = this
                  tts = TextToSpeech(this) {
                      if (it == TextToSpeech.SUCCESS) {
                          tts?.language = Locale("pt", "BR")
                      }
                  }
              }

              override fun onDestroy() {
                  running = false
                  recognizer?.destroy()
                  tts?.shutdown()
                  instance = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun speak(s: String) {
                  tts?.speak(s, TextToSpeech.QUEUE_FLUSH, null, "agente")
              }

              fun startVoice() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      toast("Voz indisponível.")
                      return
                  }

                  recognizer?.destroy()
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this)

                  recognizer?.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(p: Bundle?) {
                          speak("Pode falar.")
                      }

                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(t: Int, p: Bundle?) {}

                      override fun onError(e: Int) {
                          toast("Não entendi. Tente novamente.")
                      }

                      override fun onResults(r: Bundle?) {
                          val text = r?.getStringArrayList(
                              SpeechRecognizer.RESULTS_RECOGNITION
                          )?.firstOrNull().orEmpty()

                          if (text.isNotBlank()) {
                              speak("Ouvi: $text. A automação com inteligência artificial ainda precisa ser conectada à API.")
                          }
                      }
                  })

                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  )
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "pt-BR")
                  recognizer?.startListening(i)
              }

              fun hold(x: Float, y: Float, ms: Long) {
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(
                      path, 0, ms.coerceIn(300L, 20_000L)
                  )
                  dispatchGesture(
                      GestureDescription.Builder().addStroke(stroke).build(),
                      null,
                      null
                  )
              }

              fun screenshot(callback: (Boolean) -> Unit) {
                  takeScreenshot(
                      Display.DEFAULT_DISPLAY,
                      mainExecutor,
                      object : TakeScreenshotCallback {
                          override fun onSuccess(result: ScreenshotResult) {
                              result.hardwareBuffer.close()
                              callback(true)
                          }

                          override fun onFailure(errorCode: Int) {
                              callback(false)
                          }
                      }
                  )
              }

              private fun toast(s: String) {
                  android.os.Handler(mainLooper).post {
                      Toast.makeText(this, s, Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF
          cat > proj/app/src/main/java/com/tomo/agente/MainActivity.kt <<'EOF'
          package com.tomo.agente

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 60, 32, 32)
                  }

                  root.addView(TextView(this).apply {
                      text = "Agente v8\n\nBase inicial Android: reconhecimento de voz, serviço de acessibilidade e gesto de segurar até 20 segundos. A integração com IA, o avatar 3D e a autonomia em segundo plano ainda precisam ser implementados."
                      textSize = 18f
                  })

                  fun add(label: String, action: () -> Unit) {
                      root.addView(
                          Button(this).apply {
                              text = label
                              setOnClickListener { action() }
                          },
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  }

                  add("Permitir sobre outros apps") {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                  }

                  add("Ativar acessibilidade") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  add("Falar com o Agente") {
                      val service = AgenteService.instance
                      if (service == null) {
                          Toast.makeText(
                              this,
                              "Ative o serviço em Acessibilidade primeiro.",
                              Toast.LENGTH_LONG
                          ).show()
                      } else {
                          service.startVoice()
                      }
                  }

                  add("Testar captura de tela") {
                      val service = AgenteService.instance
                      if (service == null) {
                          Toast.makeText(
                              this,
                              "Ative Acessibilidade primeiro.",
                              Toast.LENGTH_LONG
                          ).show()
                      } else {
                          service.screenshot { ok ->
                              runOnUiThread {
                                  Toast.makeText(
                                      this,
                                      if (ok) "Captura autorizada." else "Falha na captura.",
                                      Toast.LENGTH_LONG
                                  ).show()
                              }
                          }
                      }
                  }

                  setContentView(root)
              }
          }
          EOF

      - name: Compilar APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agente-v8-${{ github.run_number }}
          name: Agente v8 build ${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
