name: Agente v1.0 - Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agente-v1-build
  cancel-in-progress: false

jobs:
  build:
    name: Construir Agente Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar estrutura Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p agente/app/src/main/java/com/tomo/agente
          mkdir -p agente/app/src/main/res/values
          mkdir -p agente/app/src/main/res/xml

          cd agente

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Agente"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.tomo.agente'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.tomo.agente'
                  minSdk 30
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AgenteTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8B5CF6</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080B18</item>
                  <item name="android:navigationBarColor">#080B18</item>
                  <item name="android:windowBackground">#080B18</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Agente</string>
              <string name="accessibility_description">Serviço de acessibilidade do Agente para executar gestos e capturar a tela mediante solicitação do usuário.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_description"
              android:notificationTimeout="250" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AgenteTheme"
                  android:supportsRtl="true">

                  <activity
